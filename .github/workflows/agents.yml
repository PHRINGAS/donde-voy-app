name: Agents (ingesta semanal + videos)

on:
  schedule:
    - cron: '0 9 * * 1' # lunes 09:00 UTC
  workflow_dispatch:
    inputs:
      command:
        description: 'Comando a ejecutar'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - ingest
          - videos

concurrency:
  group: agents
  cancel-in-progress: false

jobs:
  run-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Ingesta + matching de videos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TIKTOK_RESEARCH_API_TOKEN: ${{ secrets.TIKTOK_RESEARCH_API_TOKEN }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_ID: ${{ secrets.GOOGLE_CSE_ID }}
          VIDEO_PLACES_PER_RUN: '300'
          WEB_MAX_QUERIES: '80'
          WEB_MAX_PAGES: '300'
          # Rota la porción de la matriz de búsqueda cada corrida semanal
          WEB_QUERY_OFFSET: ${{ github.run_number }}
        run: npm run agents -- ${{ github.event.inputs.command || 'all' }}
